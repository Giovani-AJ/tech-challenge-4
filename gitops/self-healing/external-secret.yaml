# Token compartilhado entre o Grafana (contact point webhook) e o self-healer.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: self-healer-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: self-healer-secret
    creationPolicy: Owner
  data:
    - secretKey: SELFHEAL_TOKEN
      remoteRef:
        key: togglemaster/dev/togglemaster-dev-observability
        property: SELFHEAL_TOKEN
