# Loki em modo SingleBinary (1 pod), armazenamento em filesystem local.
# Escolha deliberada para o laboratório: o limite de pods por nó (t3.medium) torna
# o modo SimpleScalable/distribuído inviável, e retenção longa não é requisito.
deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    allow_structured_metadata: true      # necessário para o ingest OTLP nativo
    volume_enabled: true
    retention_period: 72h
  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: false                       # logs somem se o pod reiniciar (aceitável no lab)
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

# Zera os componentes dos outros modos.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }

# Sem caches, gateway, canary e minio: cada um seria mais um pod.
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
monitoring:
  selfMonitoring: { enabled: false }
  serviceMonitor: { enabled: false }
