# Traz do Secrets Manager (via ESO) as chaves usadas pela observabilidade:
#   NEW_RELIC_LICENSE_KEY   -> OTel gateway (exporta traces para o APM)
#   PAGERDUTY_INTEGRATION_KEY, DISCORD_WEBHOOK_URL, SELFHEAL_TOKEN -> Grafana (contact points)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: observability-secrets
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: observability-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/dev/togglemaster-dev-observability
