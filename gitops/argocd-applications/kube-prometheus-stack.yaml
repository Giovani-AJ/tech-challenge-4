apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    # K8s 1.36 tem campos novos (ex.: status.terminatingReplicas) que o schema embutido do ArgoCD 2.13
    # não conhece; o diff no servidor usa o schema do próprio cluster e evita o ComparisonError.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 86.1.0
      helm:
        valueFiles:
          - $values/gitops/observability/prometheus-stack/values.yaml
    - repoURL: https://github.com/Giovani-AJ/tech-challenge-4.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
